name: Refresh public-source dashboard
on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: crisis-watch-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect announcements and prepare analysis
        run: |
          python scripts/update.py
          python scripts/analyse.py
          python -m unittest discover -s tests -v
      - name: Commit feed, evidence assessments and archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json data/assessment.json data/reports.json data/archive/
          if ! git diff --cached --quiet; then
            git commit -m "Publish crisis watch feed and assessment"
            git push
          fi
